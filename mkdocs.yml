site_name: AC_Segmentation
site_description: Documentation for Axonal Connectomics Segmentation

theme:
  name: material
  features:
    # - navigation.sections
    - navigation.indexes
    # - navigation.expand
    # - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md

  - User Guide:
      - Basic Usage: guide/basic-usage.md
      - Examples: guide/examples.md

  # This directory is generated by gen-files.
  # literate-nav reads reference/SUMMARY.md.
  - API Reference: reference/

# extra_javascript:
#   - js/custom_navigation.js

plugins:
  - search

  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py

  - literate-nav:
      nav_file: SUMMARY.md
      implicit_index: true

  # - section-index

  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google

            # heading_level: 1
            show_root_heading: true
            show_root_full_path: false

            show_source: true

            show_signature: true
            show_signature_annotations: true
            separate_signature: true

            filters: public
            inherited_members: false
            members_order:
              - __all__
              - source
            show_bases: true
            merge_init_into_class: true
            show_if_no_docstring: true

            show_symbol_type_heading: true
            show_symbol_type_toc: true

            filters:
              - "!^_"

            summary:
              functions: true
              classes: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html

  - pymdownx.details

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.superfences

watch:
  - src/ac_segmentation

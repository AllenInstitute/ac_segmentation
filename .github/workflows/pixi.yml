name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  Pixi_Environments:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        # separated by spaces
        environments: >-
          py39-conda-scalene
          py310-conda-scalene
          py39-conda-test
          py310-conda-test
    - run: |
        pixi run -e py310-conda-scalene pytest
        pixi run -e py310-conda-test pytest
